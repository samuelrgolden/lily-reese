name: Claude

# Lets Lily update the site by writing to Claude in a GitHub issue. Claude makes
# the change on its own branch and replies with a link to open a pull request;
# Netlify builds a preview of that pull request, and merging it publishes.
#
# Only people with write access to this repository can start a run — the action
# checks that itself and refuses everyone else.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run at a time per issue or pull request, so two quick comments queue up
# instead of racing each other onto the same branch.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # sender.type keeps Claude's own comments from starting a run.
    if: |
      github.event.sender.type == 'User' && (
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Full history and every branch, so the next step can see Claude's earlier
      # branches and merge one cleanly.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Every comment on an issue starts Claude on a brand-new branch cut from
      # main, which would leave behind whatever it did for that issue last time
      # ("add these five articles", then "make the second one the dispatch").
      # Fold the earlier branch into the local main first; the action cuts its
      # new branch from that, so Claude starts where it stopped. Nothing here is
      # pushed. Comments on a pull request don't need this — there the action
      # keeps working on the pull request's own branch.
      - name: Carry over earlier work on this issue
        if: github.event.issue.number && !github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          earlier="$(git branch -r --list "origin/claude/issue-${ISSUE}-*" --format='%(refname:short)' | sort | tail -n 1)"
          if [ -z "$earlier" ]; then
            echo "No earlier branch for issue #${ISSUE}; starting from main."
            exit 0
          fi
          if git merge-base --is-ancestor "$earlier" origin/main; then
            echo "${earlier} is already part of main; starting from main."
            exit 0
          fi

          # A pull request that was merged or closed has been dealt with. Closing
          # one without merging means "I don't want this", so don't bring it back.
          state="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${earlier#origin/}" --state all --json state --jq '.[0].state // ""')"
          if [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ]; then
            echo "${earlier} has a ${state} pull request; starting from main."
            exit 0
          fi

          if git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" merge --no-edit "$earlier"; then
            echo "Carried over ${earlier}."
          else
            git merge --abort
            echo "::warning::Could not carry over ${earlier} (it conflicts with main); starting from main."
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      # Pillow is what scripts/to_webp.py compresses images with.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Runs on Sam's Claude subscription, via a token from `claude setup-token`.
          # To bill a Claude API key instead, replace the line below with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Shell commands are off unless listed here. These are the ones the
          # recipes in CLAUDE.md need: build the site, compress an image, and
          # read an article page for its headline and lead photo.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "WebFetch,Bash(npm ci),Bash(npm run build),Bash(python3 scripts/to_webp.py:*),Bash(ls:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
