# Netlify build settings — build the Vite site from source and publish dist/
[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: the build emits one index.html, so a direct hit on
# /about or /work would 404 on the CDN before React ever loads. Hand every
# unmatched path to the app and let the router resolve it. Status 200, not 301 —
# a redirect would rewrite the URL and the route would be lost.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
